global:
  scrape_interval: 15s

scrape_configs:
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080", "backend-replica:8080"]

  - job_name: discovery-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["discovery-service:8761"]

  - job_name: config-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["config-service:8888"]

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8081"]

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-service:8082"]
