spring:
  application:
    name: discovery-service

server:
  port: 8761

discovery:
  ttl-seconds: ${DISCOVERY_TTL_SECONDS:90}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: Discovery Service
    description: Lightweight service registry for Proxio microservices
