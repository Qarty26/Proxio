spring:
  application:
    name: config-service

server:
  port: 8888

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: Config Service
    description: Centralized configuration catalog for Proxio microservices

discovery:
  base-url: ${DISCOVERY_BASE_URL:http://localhost:8761}
  service-id: config-service
  instance-id: ${INSTANCE_ID:${HOSTNAME:config-local}}
  service-base-url: ${SERVICE_BASE_URL:http://localhost:8888}
  heartbeat-ms: ${DISCOVERY_HEARTBEAT_MS:30000}
