<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Post Product</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar">
    <a class="brand" th:href="@{/vendor}">Proxio Vendor</a>
    <nav class="nav-actions">
        <a th:href="@{/vendor}">Dashboard</a>
        <a th:href="@{/market}">Market</a>
        <a th:if="${isAdmin}" th:href="@{/ui/users}">Admin</a>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="ghost" type="submit">Logout</button>
        </form>
    </nav>
</header>

<main class="market-shell narrow-market">
    <a class="back-link" th:href="@{/vendor}">Back to dashboard</a>

    <form class="auth-panel wide-form"
          th:action="@{/vendor/products}"
          th:object="${form}"
          enctype="multipart/form-data"
          method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <h1>Post Product</h1>
        <p class="muted">Create a product, stock entry and weekly offer in one step.</p>
        <p class="error" th:if="${formError}" th:text="${formError}"></p>

        <div class="two-column-form">
            <label>
                Product name
                <input th:field="*{name}" required>
                <span class="field-error" th:errors="*{name}"></span>
            </label>
            <label>
                Category
                <select th:field="*{category}" required>
                    <option th:each="category : ${categories}" th:value="${category}" th:text="${category}"></option>
                </select>
                <span class="field-error" th:errors="*{category}"></span>
            </label>
            <label>
                Unit
                <input th:field="*{unit}" placeholder="kg, jar, bunch" required>
                <span class="field-error" th:errors="*{unit}"></span>
            </label>
            <label>
                Price per unit
                <input th:field="*{pricePerUnit}" type="number" min="0.01" step="0.01" required>
                <span class="field-error" th:errors="*{pricePerUnit}"></span>
            </label>
            <label>
                Stock quantity
                <input th:field="*{stockQuantity}" type="number" min="0.01" step="0.01" required>
                <span class="field-error" th:errors="*{stockQuantity}"></span>
            </label>
            <label>
                Offer quantity
                <input th:field="*{offerQuantity}" type="number" min="0.01" step="0.01" required>
                <span class="field-error" th:errors="*{offerQuantity}"></span>
            </label>
            <label>
                Valid until
                <input th:field="*{validUntil}" type="date" required>
                <span class="field-error" th:errors="*{validUntil}"></span>
            </label>
            <label>
                City
                <input th:field="*{city}" required>
                <span class="field-error" th:errors="*{city}"></span>
            </label>
            <label>
                Pickup location
                <input th:field="*{locationName}" required>
                <span class="field-error" th:errors="*{locationName}"></span>
            </label>
            <label>
                Offer note
                <input th:field="*{note}" required>
                <span class="field-error" th:errors="*{note}"></span>
            </label>
        </div>

        <label>
            Description
            <input th:field="*{description}" required>
            <span class="field-error" th:errors="*{description}"></span>
        </label>

        <label>
            Product image
            <input type="file" name="image" accept="image/png,image/jpeg,image/webp">
            <span class="muted">Optional. JPG, PNG or WEBP; otherwise Proxio uses the category image.</span>
        </label>

        <div class="form-actions">
            <button type="submit">Publish offer</button>
            <a class="button secondary" th:href="@{/vendor}">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
