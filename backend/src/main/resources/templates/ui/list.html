<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Proxio - ' + ${definition.title()}">Proxio</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar">
    <a class="brand" th:href="@{/ui}">Proxio Admin</a>
    <form th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="ghost" type="submit">Logout</button>
    </form>
</header>

<main class="shell">
    <nav class="sidebar" aria-label="Entities">
        <a th:each="entity : ${entities}"
           th:href="@{'/ui/' + ${entity.key()}}"
           th:classappend="${entity.key() == definition.key()} ? 'active'"
           th:text="${entity.title()}"></a>
    </nav>

    <section class="content">
        <div class="section-head">
            <div>
                <h1 th:text="${definition.title()}">Entities</h1>
                <p class="muted">CRUD with pagination, sorting and server-side validation.</p>
            </div>
            <a class="button" th:href="@{'/ui/' + ${definition.key()} + '/new'}">New</a>
        </div>

        <p class="success" th:if="${message}" th:text="${message}"></p>

        <form class="filters" method="get" th:action="@{'/ui/' + ${definition.key()}}">
            <label>
                Sort
                <select name="sort">
                    <option th:each="field : ${definition.sortFields()}"
                            th:value="${field}"
                            th:selected="${field == sort}"
                            th:text="${field}"></option>
                </select>
            </label>
            <label>
                Direction
                <select name="direction">
                    <option value="asc" th:selected="${direction == 'asc'}">Ascending</option>
                    <option value="desc" th:selected="${direction == 'desc'}">Descending</option>
                </select>
            </label>
            <label>
                Page size
                <input name="size" type="number" min="1" max="50" th:value="${size}">
            </label>
            <button type="submit">Apply</button>
        </form>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th th:each="field : ${definition.tableFields()}" th:text="${field}"></th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="record : ${records.content}">
                    <td th:text="${ui.property(record, 'id')}"></td>
                    <td th:each="field : ${definition.tableFields()}"
                        th:text="${ui.display(ui.property(record, field))}"></td>
                    <td class="actions">
                        <a class="button secondary" th:href="@{'/ui/' + ${definition.key()} + '/' + ${ui.property(record, 'id')} + '/edit'}">Edit</a>
                        <form th:action="@{'/ui/' + ${definition.key()} + '/' + ${ui.property(record, 'id')} + '/delete'}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="danger" type="submit">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${records.empty}">
                    <td th:colspan="${definition.tableFields().size() + 2}" class="empty">No records yet.</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="pagination">
            <a th:classappend="${records.first} ? 'disabled'"
               th:href="@{'/ui/' + ${definition.key()}(page=${records.number - 1}, size=${size}, sort=${sort}, direction=${direction})}">Previous</a>
            <span th:text="${records.number + 1} + ' / ' + ${records.totalPages == 0 ? 1 : records.totalPages}"></span>
            <a th:classappend="${records.last} ? 'disabled'"
               th:href="@{'/ui/' + ${definition.key()}(page=${records.number + 1}, size=${size}, sort=${sort}, direction=${direction})}">Next</a>
        </div>
    </section>
</main>
</body>
</html>
