<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${mode} + ' ' + ${definition.title()}">Proxio</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar">
    <a class="brand" th:href="@{/ui}">Proxio Admin</a>
    <form th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="ghost" type="submit">Logout</button>
    </form>
</header>

<main class="shell">
    <nav class="sidebar" aria-label="Entities">
        <a th:each="entity : ${entities}"
           th:href="@{'/ui/' + ${entity.key()}}"
           th:classappend="${entity.key() == definition.key()} ? 'active'"
           th:text="${entity.title()}"></a>
    </nav>

    <section class="content narrow">
        <div class="section-head">
            <div>
                <h1 th:text="${mode} + ' ' + ${definition.title()}">Form</h1>
                <p class="muted">Required fields are validated before saving.</p>
            </div>
            <a class="button secondary" th:href="@{'/ui/' + ${definition.key()}}">Back</a>
        </div>

        <div class="error-list" th:if="${!errors.isEmpty()}">
            <p th:each="error : ${errors}" th:text="${error}"></p>
        </div>

        <form class="form-grid"
              th:action="${ui.property(record, 'id') == null} ? @{'/ui/' + ${definition.key()}} : @{'/ui/' + ${definition.key()} + '/' + ${ui.property(record, 'id')}}"
              method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div th:each="field : ${fields}" class="field">
                <label th:for="${field.name()}" th:text="${field.label()}"></label>

                <select th:if="${field.relation()}"
                        th:id="${field.name()}"
                        th:name="${field.name()}"
                        th:multiple="${field.multiple()}">
                    <option th:if="${!field.multiple()}" value="">Choose...</option>
                    <option th:each="option : ${ui.relationOptions(field.relatedType())}"
                            th:value="${ui.property(option, 'id')}"
                            th:selected="${ui.selected(record, field, option)}"
                            th:text="${ui.display(option)}"></option>
                </select>

                <select th:if="${!field.relation() and field.inputType() == 'select'}"
                        th:id="${field.name()}"
                        th:name="${field.name()}">
                    <option value="">Choose...</option>
                    <option th:each="option : ${field.options()}"
                            th:value="${option}"
                            th:selected="${option == ui.property(record, field.name())}"
                            th:text="${option}"></option>
                </select>

                <div th:if="${!field.relation() and field.inputType() == 'checkbox'}" class="checkbox-row">
                    <input type="hidden" th:name="${field.name()}" value="false">
                    <input th:id="${field.name()}"
                           th:name="${field.name()}"
                           type="checkbox"
                           value="true"
                           th:checked="${ui.property(record, field.name())}">
                    <span>Enabled</span>
                </div>

                <input th:if="${!field.relation() and field.inputType() != 'select' and field.inputType() != 'checkbox'}"
                       th:id="${field.name()}"
                       th:name="${field.name()}"
                       th:type="${field.name() == 'password' ? 'password' : field.inputType()}"
                       th:value="${field.name() == 'password' ? '' : ui.property(record, field.name())}"
                       th:step="${field.inputType() == 'number' ? '0.01' : null}"
                       th:required="${field.name() != 'password' or ui.property(record, 'id') == null}">
            </div>

            <div class="form-actions">
                <button type="submit">Save</button>
                <a class="button secondary" th:href="@{'/ui/' + ${definition.key()}}">Cancel</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
