<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Proxio Login</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<main class="auth-panel">
    <h1>Proxio</h1>
    <p class="muted">Sign in to manage the marketplace.</p>

    <p class="success" th:if="${message}" th:text="${message}"></p>
    <p class="error" th:if="${param.error}">Invalid email or password.</p>
    <p class="success" th:if="${param.logout}">You have been logged out.</p>

    <form th:action="@{/login}" method="post" class="stack">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label>
            Email
            <input name="username" type="email" autocomplete="email" required>
        </label>
        <label>
            Password
            <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <label class="inline">
            <input name="remember-me" type="checkbox">
            Remember me
        </label>
        <button type="submit">Log in</button>
    </form>

    <p class="muted">No account yet? <a th:href="@{/signup}">Create one</a>.</p>
</main>
</body>
</html>
